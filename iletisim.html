<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İletişim - Türklük ve Türk Şuuru">
    <title>İletişim - Türklük ve Türk Şuuru</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="navbar-brand">
                    <h1>Türklük ve Türk Şuuru</h1>
                    <p class="subtitle">Kültür, Dil, Kimlik</p>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Anasayfa</a></li>
                    <li><a href="yazilar.html">Yazılar</a></li>
                    <li><a href="iletisim.html" class="active">İletişim</a></li>
                    <li><a href="login.html">Giriş Yap</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <section class="contact-section">
                <h2 class="section-title">Bizimle İletişime Geçin</h2>
                <div class="contact-wrapper">
                    <form id="contact-form" class="contact-form">
                        <div class="form-group">
                            <label for="name">Adınız Soyadınız</label>
                            <input type="text" id="name" name="name" required placeholder="Adınız">
                        </div>
                        <div class="form-group">
                            <label for="email">E-posta Adresiniz</label>
                            <input type="email" id="email" name="email" required placeholder="email@example.com">
                        </div>
                        <div class="form-group">
                            <label for="subject">Konu</label>
                            <input type="text" id="subject" name="subject" required placeholder="Konu">
                        </div>
                        <div class="form-group">
                            <label for="message">Mesajınız</label>
                            <textarea id="message" name="message" rows="5" required placeholder="Mesajınız..."></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Gönder</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Türklük ve Türk Şuuru. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="assets/script.js"></script>
</body>
</html>
