<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Giriş Yap - Türklük ve Türk Şuuru">
    <title>Giriş Yap - Türklük ve Türk Şuuru</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="navbar-brand">
                    <h1>Türklük ve Türk Şuuru</h1>
                    <p class="subtitle">Kültür, Dil, Kimlik</p>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Anasayfa</a></li>
                    <li><a href="yazilar.html">Yazılar</a></li>
                    <li><a href="iletisim.html">İletişim</a></li>
                    <li><a href="login.html" class="active">Giriş Yap</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <section class="login-section">
                <div class="login-container">
                    <h2 class="section-title">Yazar Girişi</h2>
                    <form id="login-form" class="login-form">
                        <div class="form-group">
                            <label for="username">Kullanıcı Adı</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Şifre</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <button type="submit" class="submit-btn">Giriş Yap</button>
                        <p id="login-error" class="error-message hidden">Kullanıcı adı veya şifre hatalı.</p>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Türklük ve Türk Şuuru. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="assets/script.js"></script>
</body>
</html>
